name: Tailnet deployment contract
on:
  pull_request:
    paths:
      - deploy/tailnet/**
      - deploy/charts/buzz/**
      - .github/workflows/tailnet-deployment.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.20.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: helm dependency build deploy/charts/buzz --skip-refresh
      - run: helm lint deploy/charts/buzz -f deploy/tailnet/values.yaml -f deploy/tailnet/owner.yaml
      - run: python -m unittest discover -s deploy/tailnet/tests -v
